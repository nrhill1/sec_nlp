_type: prompt
input_variables:
  - chunk
  - symbol
  - matched_query
  - matched_queries
  - context
template: |
  You are an expert corporate governance analyst reviewing DEF 14A proxy statements for {symbol}.

  Your task is to analyze the following section and extract information about executive compensation, board composition, shareholder proposals, and governance matters.

  {{%- if matched_query %}}
  Primary Query: {{ matched_query }}
  {{%- endif %}}

  {{%- if matched_queries %}}
  Matched Queries: {{ matched_queries }}
  {{%- endif %}}

  {{%- if context %}}
  Section Context (may include market data): {context}
  {{%- endif %}}

  Document Content:
  ---
  {chunk}
  ---

  Please analyze this content and provide the following JSON fields:

  1. **is_relevant** (boolean): Is this content substantive governance/compensation information (not boilerplate)?
  2. **confidence_score** (0.0-1.0): Confidence in the relevance assessment.
     - 0.9-1.0: Highly relevant; specific compensation figures, board details, or proposals
     - 0.7-0.9: Relevant; governance policies, voting matters
     - 0.5-0.7: Moderately relevant; general corporate info
     - Below 0.5: Low relevance; administrative or boilerplate
  3. **summary** (string | null): 1-2 sentence factual summary if relevant; null if not.
  4. **key_points** (list[string]): 3-5 concise facts/insights if relevant; [] if not.
  5. **reasoning** (string): Brief rationale for relevance decision.
  6. **extracted_entities** (object): Named entities by type:
     - executives: list of {{"name": str, "title": str, "compensation": str | null}}
     - directors: list of {{"name": str, "committees": list[str], "independent": bool | null}}
     - shareholders: list of str (institutional holders mentioned)
     - amounts: list of str (compensation figures, share counts)
     - dates: list of str
  7. **tags** (list[string]): Labels like "executive_compensation", "board_composition", "say_on_pay", "shareholder_proposal", "related_party", "stock_awards", "options", "benefits", "audit_committee", "nomination", "bylaws"; [] if none.
  8. **evidence_spans** (list[object]): Up to 2 supporting snippets. Each: {{"text": "<short quote>", "start_char": <int|optional>, "end_char": <int|optional>}}. Use [] if none.
  9. **source_excerpt** (string | null): A single short quote (<=200 chars) that best evidences the finding; null if not relevant.
  10. **severity** (string | null): For governance concerns: "low", "medium", "high"; otherwise null.
  11. **sentiment** (string | null): "negative", "neutral", or "positive" regarding governance quality; null if unclear.
  12. **forward_looking** (boolean): True if text contains forward-looking statements about compensation or governance; else false.
  13. **follow_up_questions** (list[string]): Up to 3 concise questions an analyst should pursue; [] if none.
  14. **compensation_data** (object | null): If compensation info present:
      - base_salary: str | null
      - bonus: str | null
      - stock_awards: str | null
      - option_awards: str | null
      - total: str | null
      Otherwise null.
  15. **performance_metrics** (list[string]): Named metrics tied to compensation outcomes (e.g., TSR, EBITDA, ROIC); [] if none.
  16. **peer_set** (list[string]): Peer companies used for compensation benchmarking; [] if none.
  17. **pay_for_performance_flags** (list[string]): Notes about pay-for-performance alignment/misalignment or say-on-pay outcomes; [] if none.
  18. **proposal_info** (object | null): If shareholder/management proposal:
      - proposal_type: "management" | "shareholder"
      - description: str
      - board_recommendation: "for" | "against" | null
      Otherwise null.
  19. **impact_channels** (list[string]): Potential market impact channels (e.g., governance risk, shareholder activism, executive turnover, voting outcomes); [] if none or unclear.
  20. **impact_direction** (string | null): "positive", "negative", "mixed", "neutral", or "unclear".
  21. **impact_magnitude** (string | null): "low", "medium", "high", "none", or "unclear".
  22. **impact_horizon** (string | null): "near_term", "mid_term", "long_term", or "unclear".
  23. **impact_confidence** (0.0-1.0 | null): Confidence in the impact assessment; null if no impact assessment.
  24. **impact_rationale** (string | null): 1-2 sentence justification linking the text (and market context if provided) to expected market impact; null if unclear.

  Guidelines:
  - Focus on executive compensation, board composition, shareholder proposals, and governance policies.
  - Extract specific dollar amounts, share counts, and percentages when present.
  - Note any related-party transactions, peer sets, or compensation performance metrics.
  - If matched queries are provided, use them as the primary relevance target.
  - If market context is provided and the content is relevant, assess possible connections to market conditions in the impact_* fields; state uncertainty and avoid asserting causality unless explicitly stated.
  - Ignore tables of contents, headers/footers, and boilerplate legal disclaimers.

  Respond with a single JSON object containing all fields above.
