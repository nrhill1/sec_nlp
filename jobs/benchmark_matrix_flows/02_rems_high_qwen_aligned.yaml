name: benchmark_rems_high_qwen_aligned
defaults:
  email: you@example.com
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - NdPr demand inflections from EV wind and defense and the implied earnings path under multiple demand regimes
    - mine-to-magnet vertical integration economics and the tradeoff between margin capture and execution risk
    - refining chokepoints, shipping constraints, and scenario-based supply interruption impacts on valuation
    - customer concentration and qualification-cycle delays as drivers of downside skew and volatility
    - free-cash-flow sensitivity to realized pricing, freight, and reagent costs with stress assumptions
    - financing optionality, dilution risk, and balance-sheet resilience for long-horizon portfolio construction
    output_format: json
    top_k: 100
    efts_candidates: 420
    hydrate_top_n: 150
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: benchmark_rems_high_qwen_aligned
      embedding_model: qwen3-embedding:4b
      vector_size: 2560
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: &rems_symbols
    - MP
    - LAC
    - UUUU
    - TMRC
    - AREC
    - USAR
    forms: &rems_forms
    - 10-K
    - 10-Q
    - 8-K
    - 6-K
    - 20-F
    start_date: '2023-03-12'
    dry_run: false
- id: chat_answer
  pipeline: chat
  inputs:
  - from_stage: retrieve_seed
    artifact: retrieve_seed
    target_field: seed_context
  overrides:
    question: Write a full investment committee memo for this REM basket with ranking,
      target exposure bands, scenario returns, risk limits, and explicit buy-hold-exit
      criteria.
    interactive: false
    output_format: yaml
    collections:
    - benchmark_rems_high_qwen_aligned
    top_k: 16
    max_context_chunks: 40
    context_token_budget: 32000
    include_market_context: true
    include_news_context: true
    rerank_mode: mmr
    generation_token_cap: 0
    llm_timeout_seconds: 360
    llm:
      model_name: qwen3:8b
      require_json: false
      temperature: 0.03
      max_new_tokens: 8192
      num_ctx: 32768
    vdb:
      collection_name: benchmark_rems_high_qwen_aligned
      embedding_model: qwen3-embedding:4b
      vector_size: 2560
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: *rems_symbols
    forms: *rems_forms
    start_date: '2023-03-12'
    dry_run: false
