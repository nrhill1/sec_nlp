name: benchmark_quantum_large_merged_aligned
defaults:
  email: you@example.com
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - quantum hardware roadmap error correction qubit fidelity hybrid workloads disclosures
      and trend changes
    - government contracts commercial pilots bookings conversion impacts on revenue
      visibility and risk factors
    - funding runway dilution risk IP portfolio commentary with quantified impact
      where available
    - cloud quantum access talent retention R&D intensity sensitivity and scenario
      planning
    - strategic partnerships manufacturing scale go-to-market execution execution
      milestones and bottlenecks
    - liquidity cash flow working capital revolving credit debt covenant compliance
      updates
    - capital expenditure project timeline budget variance and return-on-investment
      assumptions
    - major customer concentration contract renewal risk termination clauses and pricing
      resets
    - inflation labor freight energy input costs and gross-margin pass-through dynamics
    - foreign exchange volatility and hedging strategy implications for near-term
      guidance
    - litigation environmental liabilities contingent reserves and remediation cost
      outlook
    output_format: json
    top_k: 120
    efts_candidates: 620
    hydrate_top_n: 180
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: benchmark_quantum_large_merged_aligned
      embedding_model: qwen3-embedding:4b
      vector_size: 2560
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: &quantum_symbols
    - IONQ
    - RGTI
    - QBTS
    - QUBT
    - IBM
    - HON
    forms: &quantum_forms
    - 10-K
    - 10-Q
    - 8-K
    - 6-K
    - 20-F
    start_date: '2023-03-12'
    dry_run: false
- id: chat_answer
  pipeline: chat
  inputs:
  - from_stage: retrieve_seed
    artifact: retrieve_seed
    target_field: seed_context
  overrides:
    question: Assess commercialization readiness and funding durability across the
      quantum basket, and identify which names have the clearest path to scalable
      revenue.
    interactive: false
    output_format: yaml
    collections:
    - benchmark_quantum_large_merged_aligned
    top_k: 16
    max_context_chunks: 14
    context_token_budget: 10500
    include_market_context: true
    include_news_context: true
    rerank_mode: mmr
    generation_token_cap: 1280
    llm_timeout_seconds: 360
    llm:
      model_name: qwen3:8b
      require_json: false
      temperature: 0.05
      max_new_tokens: 1280
      num_ctx: 32768
    vdb:
      collection_name: benchmark_quantum_large_merged_aligned
      embedding_model: qwen3-embedding:4b
      vector_size: 2560
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: *quantum_symbols
    forms: *quantum_forms
    start_date: '2023-03-12'
    dry_run: false
