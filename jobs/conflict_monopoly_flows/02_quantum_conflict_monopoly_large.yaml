name: quantum_conflict_monopoly_large_flow
defaults:
  email: you@example.com
on_failure: stop
stages:
- id: retrieve_simple_terms
  pipeline: retrieve
  overrides:
    queries:
    - quantum export controls
    - quantum commercialization concentration
    - quantum cloud partnerships
    - quantum government concentration
    - quantum IP concentration
    - quantum foundry dependence
    - sovereign compute restrictions
    - quantum defense contracts
    output_format: json
    top_k: 150
    efts_candidates: 900
    hydrate_top_n: 260
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb: &quantum_vdb
      collection_name: thematic_quantum_conflict_monopoly_large
      embedding_model: qwen3-embedding:4b
      vector_size: 2560
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: &quantum_symbols
    - IONQ
    - RGTI
    - QBTS
    - QUBT
    - IBM
    - HON
    forms: &quantum_forms
    - 10-K
    - 10-Q
    - 8-K
    - 6-K
    - 20-F
    start_date: '2023-03-12'
    dry_run: false
- id: retrieve_conflict_terms
  pipeline: retrieve
  overrides:
    queries:
    - quantum export controls entity list
    - quantum defense procurement
    - sovereign compute requirements
    - trusted vendor mandates
    - restricted country screening
    - quantum semiconductor bottlenecks
    - quantum talent restrictions
    - national lab contracts
    output_format: json
    top_k: 165
    efts_candidates: 950
    hydrate_top_n: 300
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb: *quantum_vdb
    symbols: *quantum_symbols
    forms: *quantum_forms
    start_date: '2023-03-12'
    dry_run: false
- id: retrieve_monopoly_terms
  pipeline: retrieve
  overrides:
    queries:
    - quantum platform lock in
    - exclusive cloud partnership
    - sole source awards
    - patent concentration quantum
    - exclusive licensing quantum
    - hyperscaler bargaining power
    - foundry concentration quantum
    - quantum acquisitions
    output_format: json
    top_k: 170
    efts_candidates: 950
    hydrate_top_n: 320
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb: *quantum_vdb
    symbols: *quantum_symbols
    forms: *quantum_forms
    start_date: '2023-03-12'
    dry_run: false
- id: retrieve_complex_terms
  pipeline: retrieve
  overrides:
    queries:
    - quantum commercialization concentration
    - quantum hardware architecture concentration
    - quantum government program exclusivity
    - quantum fabrication access barriers
    - quantum long-term procurement frameworks
    - quantum channel lock in
    output_format: json
    top_k: 180
    efts_candidates: 1000
    hydrate_top_n: 340
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb: *quantum_vdb
    symbols: *quantum_symbols
    forms: *quantum_forms
    start_date: '2023-03-12'
    dry_run: false
- id: chat_answer
  pipeline: chat
  overrides:
    question: Compare the quantum basket on geopolitical-conflict exposure, emerging
      monopoly or gatekeeper dynamics, and concentration risk. Distinguish simple-term
      evidence from complex-term evidence, identify which issuers are building
      durable control points versus depending on governments or hyperscalers, and
      call out who is most exposed if procurement or export regimes tighten.
    interactive: false
    output_format: yaml
    collections:
    - thematic_quantum_conflict_monopoly_large
    top_k: 24
    max_context_chunks: 32
    context_token_budget: 32000
    include_market_context: true
    include_news_context: true
    rerank_mode: mmr
    generation_token_cap: 0
    llm_timeout_seconds: 360
    llm:
      model_name: qwen3:8b
      require_json: false
      temperature: 0.03
      max_new_tokens: 8192
      num_ctx: 32768
    vdb: *quantum_vdb
    symbols: *quantum_symbols
    forms: *quantum_forms
    start_date: '2023-03-12'
    dry_run: false
