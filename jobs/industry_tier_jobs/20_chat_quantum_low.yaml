name: quantum_low_chat_preset
defaults:
  email: you@example.com
on_failure: stop
stages:
- id: chat_answer
  pipeline: chat
  overrides:
    question: Assess commercialization readiness, funding risk, and contract concentration
      across this quantum basket using only cited filing evidence.
    interactive: false
    output_format: yaml
    collections:
    - industry_quantum_low
    top_k: 10
    max_context_chunks: 8
    context_token_budget: 5000
    include_market_context: true
    include_news_context: true
    rerank_mode: mmr
    generation_token_cap: 512
    llm:
      model_name: llama3.2:1b
      require_json: false
      temperature: 0.05
      max_new_tokens: 512
      num_ctx: 8192
    vdb:
      collection_name: industry_quantum_low
      embedding_model: granite-embedding:30m
      vector_size: 384
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols:
    - IONQ
    - RGTI
    - QBTS
    - QUBT
    - IBM
    - HON
    forms:
    - 10-K
    - 10-Q
    - 8-K
    - 6-K
    - 20-F
    start_date: '2021-01-01'
    dry_run: false
