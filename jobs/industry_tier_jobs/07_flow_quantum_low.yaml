name: quantum_low_flow_preset
defaults:
  email: you@example.com
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - quantum roadmap milestones and error-correction commercialization signals
    - government contract dependency and budget-cycle timing risk
    - cash runway dilution exposure and financing path clarity
    - hybrid workload adoption and enterprise pilot conversion quality
    - IP moat and competitive differentiation in hardware architecture
    - manufacturing scale constraints and vendor concentration
    - partnership durability and backlog conversion confidence
    output_format: json
    top_k: 60
    efts_candidates: 260
    hydrate_top_n: 90
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: industry_quantum_low
      embedding_model: granite-embedding:30m
      vector_size: 384
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: &id001
    - IONQ
    - RGTI
    - QBTS
    - QUBT
    - IBM
    - HON
    forms: &id002
    - 10-K
    - 10-Q
    - 8-K
    - 6-K
    - 20-F
    start_date: '2021-01-01'
    dry_run: false
- id: chat_answer
  pipeline: chat
  inputs:
  - from_stage: retrieve_seed
    artifact: retrieve_seed
    target_field: seed_context
  overrides:
    question: Assess commercialization readiness, funding risk, and contract concentration
      across this quantum basket using only cited filing evidence.
    interactive: false
    output_format: yaml
    collections:
    - industry_quantum_low
    top_k: 10
    max_context_chunks: 8
    context_token_budget: 5000
    include_market_context: true
    include_news_context: true
    rerank_mode: mmr
    generation_token_cap: 512
    llm:
      model_name: llama3.2:1b
      require_json: false
      temperature: 0.05
      max_new_tokens: 512
      num_ctx: 8192
    vdb:
      collection_name: industry_quantum_low
      embedding_model: granite-embedding:30m
      vector_size: 384
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: *id001
    forms: *id002
    start_date: '2021-01-01'
    dry_run: false
