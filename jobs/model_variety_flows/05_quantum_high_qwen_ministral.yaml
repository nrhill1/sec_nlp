name: quantum_high_qwen_ministral
defaults:
  email: your-real-email@example.com
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - roadmap milestones, error-correction claims, and commercialization timing as valuation triggers
    - government and defense contract concentration, renewal uncertainty, and backlog quality
    - cash runway, dilution timing, and margin path under scale-up and delay scenarios
    - pipeline conversion rates, recurring revenue quality, and deal concentration risk
    - competitive positioning across superconducting trapped-ion and neutral-atom approaches for relative positioning
    output_format: json
    top_k: 90
    efts_candidates: 340
    hydrate_top_n: 120
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: variety_quantum_high
      embedding_model: qwen3-embedding:4b
      vector_size: 2560
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: &symbols
    - IONQ
    - RGTI
    - QBTS
    - QUBT
    - IBM
    forms: &forms
    - 10-K
    - 10-Q
    - 8-K
    - 6-K
    - 20-F
    start_date: '2021-01-01'
    dry_run: false
- id: chat_answer
  pipeline: chat
  inputs:
  - from_stage: retrieve_seed
    artifact: retrieve_seed
    target_field: seed_context
  overrides:
    question: Build an investment strategy playbook for this quantum basket with position weights, optionality versus solvency tradeoffs, catalyst-based entries, and hard risk limits.
    interactive: false
    output_format: yaml
    collections:
    - variety_quantum_high
    top_k: 14
    max_context_chunks: 40
    context_token_budget: 32000
    include_market_context: true
    include_news_context: true
    rerank_mode: mmr
    generation_token_cap: 0
    llm:
      model_name: ministral-3:3b
      require_json: false
      temperature: 0.05
      max_new_tokens: 8192
      num_ctx: 32768
    vdb:
      collection_name: variety_quantum_high
      embedding_model: qwen3-embedding:4b
      vector_size: 2560
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: *symbols
    forms: *forms
    start_date: '2021-01-01'
    dry_run: false
