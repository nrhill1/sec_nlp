name: tech_medium_mxbai_qwen8b
defaults:
  email: your-real-email@example.com
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - AI capex cycle durability and implications for multi-quarter revenue-growth positioning
    - backlog quality, pipeline conversion risk, and revenue visibility for timing overweight decisions
    - pricing versus competition and the effect on operating leverage and valuation multiples
    - foundry dependency, supply concentration, and inventory normalization as downside risk channels
    - free-cash-flow durability under elevated R-and-D and shareholder-return commitments
    output_format: json
    top_k: 80
    efts_candidates: 320
    hydrate_top_n: 110
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: variety_tech_medium
      embedding_model: mxbai-embed-large:latest
      vector_size: 1024
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: &symbols
    - NVDA
    - AMD
    - AVGO
    - INTC
    - TSM
    - ASML
    forms: &forms
    - 10-K
    - 10-Q
    - 8-K
    - 6-K
    - 20-F
    start_date: '2021-01-01'
    dry_run: false
- id: chat_answer
  pipeline: chat
  inputs:
  - from_stage: retrieve_seed
    artifact: retrieve_seed
    target_field: seed_context
  overrides:
    question: Produce a portfolio strategy for this tech basket with conviction ranking, position sizing tiers, catalyst calendar, and risk-adjusted hold versus trim decisions.
    interactive: false
    output_format: yaml
    collections:
    - variety_tech_medium
    top_k: 14
    max_context_chunks: 40
    context_token_budget: 30000
    include_market_context: true
    include_news_context: true
    rerank_mode: mmr
    generation_token_cap: 0
    llm:
      model_name: qwen3:8b
      require_json: false
      temperature: 0.04
      max_new_tokens: 8192
      num_ctx: 32768
    vdb:
      collection_name: variety_tech_medium
      embedding_model: mxbai-embed-large:latest
      vector_size: 1024
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: *symbols
    forms: *forms
    start_date: '2021-01-01'
    dry_run: false
