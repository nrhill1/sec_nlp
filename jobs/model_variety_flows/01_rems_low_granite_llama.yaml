name: rems_low_granite_llama
defaults:
  email: your-real-email@example.com
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - NdPr supply-demand balance and expected pricing path over the next 12 to 24 months
    - unit-cost curve position, break-even sensitivity, and margin durability at lower realized prices
    - capex milestones, funding sources, and dilution risk under delayed commissioning scenarios
    - offtake mix fixed versus spot pricing, customer concentration, and contract reset exposure
    - portfolio timing signals including entry triggers, trim signals, and downside risk catalysts
    output_format: json
    top_k: 60
    efts_candidates: 300
    hydrate_top_n: 90
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: variety_rems_low
      embedding_model: granite-embedding:30m
      vector_size: 384
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: &symbols
    - MP
    - LAC
    - UUUU
    - TMRC
    - AREC
    - USAR
    forms: &forms
    - 10-K
    - 10-Q
    - 8-K
    - 6-K
    - 20-F
    start_date: '2021-01-01'
    dry_run: false
- id: chat_answer
  pipeline: chat
  inputs:
  - from_stage: retrieve_seed
    artifact: retrieve_seed
    target_field: seed_context
  overrides:
    question: Draft an investment strategy memo for this REM basket with overweight-neutral-underweight calls, entry triggers, downside hedges, and bull-base-bear drivers for the next 12 months.
    interactive: false
    output_format: yaml
    collections:
    - variety_rems_low
    top_k: 12
    max_context_chunks: 40
    context_token_budget: 30000
    include_market_context: true
    include_news_context: true
    rerank_mode: score
    generation_token_cap: 0
    llm:
      model_name: llama3.2:1b
      require_json: false
      temperature: 0.05
      max_new_tokens: 8192
      num_ctx: 32768
    vdb:
      collection_name: variety_rems_low
      embedding_model: granite-embedding:30m
      vector_size: 384
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: *symbols
    forms: *forms
    start_date: '2021-01-01'
    dry_run: false
