name: tech_xlarge_retrieve_chat
defaults:
  email: you@example.com
  symbols:
  - AAPL
  - MSFT
  - NVDA
  - AMD
  - AVGO
  - ORCL
  forms:
  - 10-K
  - 10-Q
  - 8-K
  - 6-K
  - 20-F
  start_date: '2021-01-01'
  dry_run: false
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - AI data center demand GPU supply cloud consumption enterprise backlog disclosures
      and trend changes
    - subscription retention semiconductor lead times inventory normalization impacts
      on revenue visibility and risk factors
    - pricing discipline gross margin outlook hyperscaler capex commentary with quantified
      impact where available
    - customer concentration export restrictions foundry capacity sensitivity and
      scenario planning
    - platform adoption free cash flow competitive intensity execution milestones
      and bottlenecks
    - liquidity cash flow working capital revolving credit debt covenant compliance
      updates
    - capital expenditure project timeline budget variance and return-on-investment
      assumptions
    - major customer concentration contract renewal risk termination clauses and pricing
      resets
    - inflation labor freight energy input costs and gross-margin pass-through dynamics
    - foreign exchange volatility and hedging strategy implications for near-term
      guidance
    - litigation environmental liabilities contingent reserves and remediation cost
      outlook
    - inventory strategy lead-time management dual sourcing localization and continuity
      planning
    - management outlook revisions, guidance confidence bands, and downside risk triggers
    - board strategy for financing, partnership optionality, and portfolio optimization
    output_format: json
    top_k: 150
    efts_candidates: 700
    hydrate_top_n: 200
    query_term_min_hits: 1
    query_term_min_ratio: 0.2
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: flow_tech_xlarge
- id: chat_answer
  pipeline: chat
  seed_from_stage: retrieve_seed
  overrides:
    question: Summarize AI-infrastructure and enterprise demand signals for this tech
      basket, with emphasis on backlog durability, margin risk, and capex efficiency.
    interactive: false
    output_format: yaml
    collections:
    - flow_tech_xlarge
    top_k: 18
    max_context_chunks: 14
    context_token_budget: 9500
    include_market_context: true
    include_news_context: true
    rerank_mode: mmr
    generation_token_cap: 1024
