name: rems_medium_retrieve_chat
defaults:
  email: you@example.com
  symbols:
  - MP
  - LAC
  - UUUU
  - TMRC
  - AREC
  - USAR
  forms:
  - 10-K
  - 10-Q
  - 8-K
  - 6-K
  - 20-F
  start_date: '2021-01-01'
  dry_run: false
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - rare earth oxide pricing NdPr demand magnet supply chain separation capacity
      disclosures and trend changes
    - processing bottlenecks offtake agreements export controls impacts on revenue
      visibility and risk factors
    - China dependency permitting timelines concentrate feedstock commentary with
      quantified impact where available
    - capex funding strategic stockpiles defense demand sensitivity and scenario planning
    - shipping routes conversion yields downstream integration execution milestones
      and bottlenecks
    - liquidity cash flow working capital revolving credit debt covenant compliance
      updates
    - capital expenditure project timeline budget variance and return-on-investment
      assumptions
    - major customer concentration contract renewal risk termination clauses and pricing
      resets
    output_format: json
    top_k: 60
    efts_candidates: 320
    hydrate_top_n: 90
    query_term_min_hits: 1
    query_term_min_ratio: 0.2
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: flow_rems_medium
- id: chat_answer
  pipeline: chat
  seed_from_stage: retrieve_seed
  overrides:
    question: Compare NdPr supply-chain risk, processing bottlenecks, and pricing
      power across the REM basket, highlighting the strongest and weakest positioning.
    interactive: false
    output_format: yaml
    collections:
    - flow_rems_medium
    top_k: 12
    max_context_chunks: 10
    context_token_budget: 6000
    include_market_context: true
    include_news_context: false
    rerank_mode: score
    generation_token_cap: 640
