name: quantum_smoke_retrieve_chat
defaults:
  email: you@example.com
  symbols:
  - IONQ
  - RGTI
  - QBTS
  - QUBT
  - IBM
  - HON
  forms:
  - 10-K
  - 10-Q
  - 8-K
  - 6-K
  - 20-F
  start_date: '2021-01-01'
  dry_run: false
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - quantum hardware roadmap error correction qubit fidelity hybrid workloads disclosures
      and trend changes
    - government contracts commercial pilots bookings conversion impacts on revenue
      visibility and risk factors
    - funding runway dilution risk IP portfolio commentary with quantified impact
      where available
    - cloud quantum access talent retention R&D intensity sensitivity and scenario
      planning
    output_format: json
    top_k: 25
    efts_candidates: 140
    hydrate_top_n: 35
    query_term_min_hits: 1
    query_term_min_ratio: 0.2
    stopword_aware_lexical: true
    rerank_with_embeddings: false
    index_results: false
    vdb:
      collection_name: flow_quantum_smoke
- id: chat_answer
  pipeline: chat
  seed_from_stage: retrieve_seed
  overrides:
    question: Assess commercialization readiness and funding durability across the
      quantum basket, and identify which names have the clearest path to scalable
      revenue.
    interactive: false
    output_format: yaml
    collections:
    - flow_quantum_smoke
    top_k: 8
    max_context_chunks: 6
    context_token_budget: 3500
    include_market_context: false
    include_news_context: false
    rerank_mode: score
    generation_token_cap: 448
