name: mining_medium_retrieve_chat
defaults:
  email: you@example.com
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - ore grade trends reserve replacement mine plan revisions smelter treatment charges
      disclosures and trend changes
    - royalty exposure permitting and ESG labor negotiations impacts on revenue visibility
      and risk factors
    - energy input costs transport logistics commodity price sensitivity commentary
      with quantified impact where available
    - hedging policy balance sheet leverage project development sensitivity and scenario
      planning
    - water rights geopolitical jurisdiction risk production guidance variance execution
      milestones and bottlenecks
    - liquidity cash flow working capital revolving credit debt covenant compliance
      updates
    - capital expenditure project timeline budget variance and return-on-investment
      assumptions
    - major customer concentration contract renewal risk termination clauses and pricing
      resets
    output_format: json
    top_k: 60
    efts_candidates: 320
    hydrate_top_n: 90
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: flow_mining_medium
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: &id001
    - FCX
    - SCCO
    - BHP
    - RIO
    - VALE
    - NEM
    forms: &id002
    - 10-K
    - 10-Q
    - 8-K
    - 6-K
    - 20-F
    start_date: '2021-01-01'
    dry_run: false
- id: chat_answer
  pipeline: chat
  inputs:
  - from_stage: retrieve_seed
    artifact: retrieve_seed
    target_field: seed_context
  overrides:
    question: Evaluate operational execution, jurisdiction risk, and margin sensitivity
      across this mining basket under different commodity-price scenarios.
    interactive: false
    output_format: yaml
    collections:
    - flow_mining_medium
    top_k: 12
    max_context_chunks: 10
    context_token_budget: 6000
    include_market_context: true
    include_news_context: false
    rerank_mode: score
    generation_token_cap: 640
    symbols: *id001
    forms: *id002
    start_date: '2021-01-01'
    dry_run: false
