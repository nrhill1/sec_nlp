name: smoke_medium_retrieve_chat
defaults:
  email: you@example.com
  symbols:
  - CDE
  - AAPL
  - FCX
  forms:
  - 10-K
  - 10-Q
  - 8-K
  - 6-K
  - 20-F
  start_date: '2021-01-01'
  dry_run: false
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - risk factors liquidity working capital debt covenant disclosures and trend changes
    - supply chain customer concentration capital expenditure impacts on revenue visibility
      and risk factors
    - guidance margin pressure geopolitical risk commentary with quantified impact
      where available
    - tariffs inflation cost control sensitivity and scenario planning
    - cash flow operational execution remediation liabilities execution milestones
      and bottlenecks
    - liquidity cash flow working capital revolving credit debt covenant compliance
      updates
    - capital expenditure project timeline budget variance and return-on-investment
      assumptions
    - major customer concentration contract renewal risk termination clauses and pricing
      resets
    output_format: json
    top_k: 60
    efts_candidates: 320
    hydrate_top_n: 90
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: flow_smoke_medium
      qdrant_url: http://localhost:6333
      qdrant_location: null
- id: chat_answer
  pipeline: chat
  seed_from_stage: retrieve_seed
  overrides:
    question: What are the most material near-term risk, liquidity, and margin signals
      across this smoke basket, and which issuer appears most vulnerable?
    interactive: false
    output_format: yaml
    collections:
    - flow_smoke_medium
    top_k: 12
    max_context_chunks: 10
    context_token_budget: 6000
    include_market_context: true
    include_news_context: false
    rerank_mode: score
    generation_token_cap: 640
