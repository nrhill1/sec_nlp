name: rems_xlarge_retrieve_chat
defaults:
  email: you@example.com
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - rare earth oxide pricing NdPr demand magnet supply chain separation capacity
      disclosures and trend changes
    - processing bottlenecks offtake agreements export controls impacts on revenue
      visibility and risk factors
    - China dependency permitting timelines concentrate feedstock commentary with
      quantified impact where available
    - capex funding strategic stockpiles defense demand sensitivity and scenario planning
    - shipping routes conversion yields downstream integration execution milestones
      and bottlenecks
    - liquidity cash flow working capital revolving credit debt covenant compliance
      updates
    - capital expenditure project timeline budget variance and return-on-investment
      assumptions
    - major customer concentration contract renewal risk termination clauses and pricing
      resets
    - inflation labor freight energy input costs and gross-margin pass-through dynamics
    - foreign exchange volatility and hedging strategy implications for near-term
      guidance
    - litigation environmental liabilities contingent reserves and remediation cost
      outlook
    - inventory strategy lead-time management dual sourcing localization and continuity
      planning
    - management outlook revisions, guidance confidence bands, and downside risk triggers
    - board strategy for financing, partnership optionality, and portfolio optimization
    output_format: json
    top_k: 150
    efts_candidates: 700
    hydrate_top_n: 200
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: flow_rems_xlarge
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: &id001
    - MP
    - LAC
    - UUUU
    - TMRC
    - AREC
    - USAR
    forms: &id002
    - 10-K
    - 10-Q
    - 8-K
    - 6-K
    - 20-F
    start_date: '2021-01-01'
    dry_run: false
- id: chat_answer
  pipeline: chat
  inputs:
  - from_stage: retrieve_seed
    artifact: retrieve_seed
    target_field: seed_context
  overrides:
    question: Compare NdPr supply-chain risk, processing bottlenecks, and pricing
      power across the REM basket, highlighting the strongest and weakest positioning.
    interactive: false
    output_format: yaml
    collections:
    - flow_rems_xlarge
    top_k: 18
    max_context_chunks: 14
    context_token_budget: 9500
    include_market_context: true
    include_news_context: true
    rerank_mode: mmr
    generation_token_cap: 1024
    symbols: *id001
    forms: *id002
    start_date: '2021-01-01'
    dry_run: false
