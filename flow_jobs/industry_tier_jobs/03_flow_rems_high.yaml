name: rems_high_flow_preset
defaults:
  email: you@example.com
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - rare earth oxide pricing NdPr demand magnet supply chain resilience
    - processing bottlenecks separation capacity and downstream conversion throughput
    - permit timing and mine-to-refinery ramp risks with capex dependency
    - offtake structure customer concentration and pricing reset exposure
    - export controls and geopolitical risk for rare earth critical inputs
    - liquidity debt maturities covenant flexibility and funding runway
    - inventory strategy logistics constraints and freight cost sensitivity
    output_format: json
    top_k: 150
    efts_candidates: 850
    hydrate_top_n: 220
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: industry_rems_high
      embedding_model: qwen3-embedding:4b
      vector_size: 2560
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: &id001
    - MP
    - LAC
    - UUUU
    - TMRC
    - AREC
    - USAR
    forms: &id002
    - 10-K
    - 10-Q
    - 8-K
    - 6-K
    - 20-F
    start_date: '2021-01-01'
    dry_run: false
- id: chat_answer
  pipeline: chat
  inputs:
  - from_stage: retrieve_seed
    artifact: retrieve_seed
    target_field: seed_context
  overrides:
    question: Compare NdPr supply security, pricing leverage, and balance-sheet risk
      across this REM basket using filing-grounded evidence.
    interactive: false
    output_format: yaml
    collections:
    - industry_rems_high
    top_k: 16
    max_context_chunks: 16
    context_token_budget: 12000
    include_market_context: true
    include_news_context: true
    rerank_mode: mmr
    generation_token_cap: 1280
    llm:
      model_name: qwen3:8b
      require_json: false
      temperature: 0.05
      max_new_tokens: 1280
      num_ctx: 32768
    vdb:
      collection_name: industry_rems_high
      embedding_model: qwen3-embedding:4b
      vector_size: 2560
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: *id001
    forms: *id002
    start_date: '2021-01-01'
    dry_run: false
