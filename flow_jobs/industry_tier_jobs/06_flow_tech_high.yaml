name: tech_high_flow_preset
defaults:
  email: you@example.com
  symbols:
  - AAPL
  - MSFT
  - NVDA
  - AMD
  - AVGO
  - ORCL
  forms:
  - 10-K
  - 10-Q
  - 8-K
  - 6-K
  - 20-F
  start_date: '2021-01-01'
  dry_run: false
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - AI infrastructure demand trends and data center capacity commitments
    - gross margin durability amid mix shift and pricing normalization
    - enterprise software renewal quality and cloud consumption elasticity
    - supply chain concentration and component availability risk drivers
    - capital allocation priorities buybacks capex and strategic M&A posture
    - regulatory and antitrust exposure tied to platform strategy
    - FX and macro sensitivity in guidance assumptions
    output_format: json
    top_k: 150
    efts_candidates: 850
    hydrate_top_n: 220
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: industry_tech_high
      embedding_model: qwen3-embedding:4b
      vector_size: 2560
      qdrant_url: http://localhost:6333
      qdrant_location: null
- id: chat_answer
  pipeline: chat
  seed_from_stage: retrieve_seed
  overrides:
    question: Identify the strongest and weakest operating leverage profiles in this
      tech basket and explain key execution and valuation risks from filings.
    interactive: false
    output_format: yaml
    collections:
    - industry_tech_high
    top_k: 16
    max_context_chunks: 16
    context_token_budget: 12000
    include_market_context: true
    include_news_context: true
    rerank_mode: mmr
    generation_token_cap: 1280
    llm:
      model_name: qwen3:8b
      require_json: false
      temperature: 0.05
      max_new_tokens: 1280
      num_ctx: 32768
    vdb:
      collection_name: industry_tech_high
      embedding_model: qwen3-embedding:4b
      vector_size: 2560
      qdrant_url: http://localhost:6333
      qdrant_location: null
