name: biotech_medium_flow_preset
defaults:
  email: you@example.com
  symbols:
  - MRNA
  - BNTX
  - CRSP
  - REGN
  - VRTX
  - GILD
  forms:
  - 10-K
  - 10-Q
  - 8-K
  - 6-K
  - 20-F
  start_date: '2021-01-01'
  dry_run: false
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - clinical readout timing and pivotal trial dependency by program
    - regulatory pathway complexity and post-approval surveillance burden
    - manufacturing scalability and CMC execution risks
    - patent exclusivity horizon and biosimilar competition exposure
    - commercial launch durability reimbursement pressure and channel risk
    - cash burn runway and business development optionality
    - pipeline concentration and single-asset downside scenarios
    output_format: json
    top_k: 100
    efts_candidates: 500
    hydrate_top_n: 150
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: industry_biotech_medium
      embedding_model: mxbai-embed-large:latest
      vector_size: 1024
      qdrant_url: http://localhost:6333
      qdrant_location: null
- id: chat_answer
  pipeline: chat
  inputs:
  - from_stage: retrieve_seed
    artifact: retrieve_seed
    target_field: seed_context
  overrides:
    question: Rank this biotech basket by near-term catalyst quality versus downside
      risk, citing concrete filing disclosures on trials, regulation, and runway.
    interactive: false
    output_format: yaml
    collections:
    - industry_biotech_medium
    top_k: 12
    max_context_chunks: 12
    context_token_budget: 8000
    include_market_context: true
    include_news_context: true
    rerank_mode: mmr
    generation_token_cap: 896
    llm:
      model_name: ministral-3:3b
      require_json: false
      temperature: 0.05
      max_new_tokens: 896
      num_ctx: 16384
    vdb:
      collection_name: industry_biotech_medium
      embedding_model: mxbai-embed-large:latest
      vector_size: 1024
      qdrant_url: http://localhost:6333
      qdrant_location: null
