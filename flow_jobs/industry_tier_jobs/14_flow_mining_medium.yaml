name: mining_medium_flow_preset
defaults:
  email: you@example.com
on_failure: stop
stages:
- id: retrieve_seed
  pipeline: retrieve
  overrides:
    queries:
    - ore grade trend and reserve replacement implications for medium-term output
    - cost curve position under energy freight and labor inflation
    - jurisdiction risk permitting challenges and fiscal regime uncertainty
    - smelter and refining constraints plus treatment charge pressure
    - water tailings and ESG compliance liabilities with potential capex drag
    - balance sheet flexibility under commodity downside scenarios
    - project execution slippage and ramp reliability indicators
    output_format: json
    top_k: 100
    efts_candidates: 500
    hydrate_top_n: 150
    query_term_min_hits: 0
    query_term_min_ratio: 0.0
    stopword_aware_lexical: true
    rerank_with_embeddings: true
    index_results: true
    vdb:
      collection_name: industry_mining_medium
      embedding_model: mxbai-embed-large:latest
      vector_size: 1024
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: &id001
    - FCX
    - SCCO
    - BHP
    - RIO
    - VALE
    - NEM
    forms: &id002
    - 10-K
    - 10-Q
    - 8-K
    - 6-K
    - 20-F
    start_date: '2021-01-01'
    dry_run: false
- id: chat_answer
  pipeline: chat
  inputs:
  - from_stage: retrieve_seed
    artifact: retrieve_seed
    target_field: seed_context
  overrides:
    question: Compare cost resilience, project execution risk, and jurisdiction exposure
      across this mining basket based on filing evidence.
    interactive: false
    output_format: yaml
    collections:
    - industry_mining_medium
    top_k: 12
    max_context_chunks: 12
    context_token_budget: 8000
    include_market_context: true
    include_news_context: true
    rerank_mode: mmr
    generation_token_cap: 896
    llm:
      model_name: ministral-3:3b
      require_json: false
      temperature: 0.05
      max_new_tokens: 896
      num_ctx: 16384
    vdb:
      collection_name: industry_mining_medium
      embedding_model: mxbai-embed-large:latest
      vector_size: 1024
      qdrant_url: http://localhost:6333
      qdrant_location: null
    symbols: *id001
    forms: *id002
    start_date: '2021-01-01'
    dry_run: false
