[package]
name = "efts"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "efts"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.28.2", features = ["extension-module", "abi3-py313"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"
once_cell = "1.19"
chrono = "0.4"
keyword_extraction = { version = "1.5", features = ["yake", "tf_idf", "rake", "text_rank"] }
stop-words = "0.8"

[build-dependencies]
pyo3-build-config = "0.28.2"
