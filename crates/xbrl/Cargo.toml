[package]
name = "xbrl"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "xbrl"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.28.2", features = ["extension-module", "abi3-py313"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.11"
quick-xml = "0.37"
chrono = "0.4"
once_cell = "1.20"

[build-dependencies]
pyo3-build-config = "0.28.2"
