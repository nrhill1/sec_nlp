[project]
name = "sec-nlp"
version = "1.1.1"
description = "NLP tools for SEC filings"
license = {text = "MIT"}
keywords = ["sec", "nlp", "langchain", "qdrant", "edgar", "financial", "documents"]
authors = [
  { name = "Nicolas Hill", email = "nrhill1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
  "python-dotenv",
  "pydantic>=2.0.0",
  "langchain>=1.0.2",
  "langchain-core>=1.0.0",
  "langchain-community",
  "langchain-qdrant",
  "langchain-text-splitters",
  "beautifulsoup4",
  "lxml",
  "markdownify",
  "sec_edgar_downloader",
  "simhash>=2.1.2",
  "qdrant-client>=1.15.1",
  "platformdirs>=4.5.0",
  "pydantic-settings>=2.11.0",
  "langchain-ollama>=1.0.0",
  "questionary>=2.1.1",
  "python-ulid>=3.1.0",
  "tqdm",
  "unstructured>=0.18.20",
  "pyahocorasick>=2.2.0",
  "pandas>=2.3.3",
  "fredapi>=0.5.2",
  "rich>=13.8.0",
]

[project.scripts]
sec-nlp = "sec_nlp.cli.__main__:main"
profile-memory = "scripts.profile.memory:main"
check-imports = "scripts.build.check_imports:main"

[tool.uv]
cache-keys = [
  {file = "pyproject.toml"},
  {file = "crates/market/Cargo.toml"},
  {file = "crates/efts/Cargo.toml"},
  {file = "crates/corr/Cargo.toml"},
  {file = "crates/xbrl/Cargo.toml"},
  {file = "crates/entity/Cargo.toml"},
  {file = "**/*.rs"},
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/market/Cargo.toml"
module-name = "market"
python-source = "src"
python-packages = ["sec_nlp", "scripts"]
include = ["src/sec_nlp/py.typed"]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
  "pytest-cov>=7.0.0",
  "coverage[toml]>=7.0.0",
  "ruff>=0.6.0",
  "types-requests",
  "types-tqdm",
  "types-PyYAML",
  "pytest>=8.4.2",
  "pip>=25.2",
  "typing-extensions>=4.15.0",
  "pre-commit>=4.3.0",
  "snakeviz>=2.2.0",
  "memory-profiler>=0.61.0",
  "py-spy>=0.3.14",
  "pytest-benchmark>=5.2.3",
  "types-psutil>=7.1.3.20251125",
  "ty>=0.0.4",
  "pytest-socket>=0.7.0",
  "pytest-xdist>=3.5.0",
  "mypy>=1.19.1",
  "maturin>=1.5.0",
]
