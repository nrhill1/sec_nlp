[project]
name = "sec-nlp"
version = "1.1.2"
description = "NLP tools for SEC filings"
license = {text = "MIT"}
keywords = ["sec", "nlp", "langchain", "qdrant", "edgar", "financial", "documents"]
authors = [
  { name = "Nicolas Hill", email = "nrhill1@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
  "python-dotenv",
  "pydantic>=2.0.0",
  "pydantic-settings>=2.11.0",
  "httpx>=0.28.0",
  "PyYAML>=6.0",
  "beautifulsoup4",
  "lxml",
  "simhash>=2.1.2",
  "platformdirs>=4.5.0",
  "unstructured==0.21.5",
  "pyahocorasick>=2.2.0",
  "rich>=13.8.0",
  "textual>=8.2.0",
  "requests>=2.32.0",
]

[project.optional-dependencies]
ai = ["langchain-core>=1.0.0", "langchain-ollama>=1.0.0", "numpy>=2.3.4"]
vector = ["langchain-core>=1.0.0", "langchain-ollama>=1.0.0", "langchain-qdrant", "qdrant-client>=1.15.1", "langchain-experimental", "numpy>=2.3.4"]
economic = ["fredapi>=0.5.2"]

[project.scripts]
sec-nlp = "sec_nlp.cli.__main__:main"
profile-memory = "scripts.profile.memory:main"
check-imports = "scripts.build.check_imports:main"

[tool.uv]
cache-keys = [
  {file = "pyproject.toml"},
  {file = "crates/market/Cargo.toml"},
  {file = "crates/efts/Cargo.toml"},
  {file = "crates/corr/Cargo.toml"},
  {file = "crates/xbrl/Cargo.toml"},
  {file = "crates/entity/Cargo.toml"},
  {file = "crates/newswatch/Cargo.toml"},
  {file = "**/*.rs"},
  {file = "**/*.pyi"},
]

[tool.maturin]
bindings = "pyo3"
manifest-path = "crates/market/Cargo.toml"
module-name = "market"
python-source = "src"
python-packages = ["sec_nlp", "scripts"]
include = ["src/sec_nlp/py.typed"]

[build-system]
requires = ["maturin>=1.5,<2.0"]
build-backend = "maturin"

[dependency-groups]
dev = [
  "pytest-cov>=7.0.0",
  "coverage[toml]>=7.0.0",
  "ruff>=0.6.0",
  "types-requests",
  "types-PyYAML",
  "pytest>=8.4.2",
  "pip>=25.2",
  "typing-extensions>=4.15.0",
  "pre-commit>=4.3.0",
  "snakeviz>=2.2.0",
  "memory-profiler>=0.61.0",
  "py-spy>=0.3.14",
  "pytest-benchmark>=5.2.3",
  "types-psutil>=7.1.3.20251125",
  "ty>=0.0.4",
  "pytest-socket>=0.7.0",
  "pytest-xdist>=3.5.0",
  "mypy>=1.19.1",
  "maturin>=1.5.0",
]
